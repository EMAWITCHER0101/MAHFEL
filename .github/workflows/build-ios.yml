name: Build iOS

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      signing_method:
        description: 'روش امضا (فقط وقتی گواهی تنظیم شده)'
        type: choice
        options: ['ad-hoc', 'app-store']
        default: 'ad-hoc'

concurrency:
  group: build-ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      P12_CERT: ${{ secrets.IOS_P12_CERT }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Select Xcode 16+
        run: |
          ls /Applications | grep -i xcode || true
          XCODE_PATH=$(ls -d /Applications/Xcode_1*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Ensure Xcode >= 16
        run: |
          V=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Selected Xcode: $V"
          MAJOR=$(echo "$V" | cut -d. -f1)
          if [ "$MAJOR" -lt 16 ]; then
            echo "::error::Xcode $V is too old for latest Firebase. Need Xcode 16+ (Swift 6)."
            ls -la /Applications | grep -i xcode || true
            exit 1
          fi

      - name: Install CocoaPods (if missing)
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi
          pod --version

      - name: Pod install
        working-directory: ios
        run: |
          pod install || pod install --repo-update
          if grep -q "Firebase" Podfile.lock 2>/dev/null; then
            echo "Firebase pod installed OK"
          fi

      - name: Import signing certificate (if provided)
        if: env.P12_CERT != ''
        run: |
          echo "${{ secrets.IOS_P12_CERT }}" | base64 --decode > /tmp/cert.p12
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}" | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security create-keychain -p temp build.keychain || true
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "${{ secrets.IOS_P12_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k temp build.keychain

      - name: Build (unsigned / ad-hoc)
        if: env.P12_CERT == ''
        working-directory: ios
        run: |
          xcodebuild -workspace Mahfel.xcworkspace -scheme Mahfel \
            -configuration Release -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Build (signed)
        if: env.P12_CERT != ''
        working-directory: ios
        run: |
          xcodebuild -workspace Mahfel.xcworkspace -scheme Mahfel \
            -configuration Release -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic build

      - name: Package .ipa
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/Mahfel.app
          if [ ! -d "$APP" ]; then
            echo "::error::Mahfel.app built at unexpected path" && ls -R build/Build/Products || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Mahfel.ipa Payload
          rm -rf Payload
          ls -lh Mahfel.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mahfel-iOS
          path: ios/Mahfel.ipa
          retention-days: 14

      - name: Verify .ipa
        working-directory: ios
        run: |
          unzip -l Mahfel.ipa | head -20
          if command -v codesign >/dev/null 2>&1; then
            codesign -dv build/Build/Products/Release-iphoneos/Mahfel.app 2>&1 | grep -i "Identifier\|TeamIdentifier\|Signature" || true
          fi
